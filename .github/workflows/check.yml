name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      # Matches the exact Playwright dependency; includes all three browser engines.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Matches the image's pwuser/home ownership so Firefox can launch.
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Quality checks
        if: matrix.browser == 'chromium'
        run: npm run lint && npm run validate:html && npm run validate:translations && npm test
      - name: Browser checks
        run: npm run test:e2e -- --project=${{ matrix.browser }} --max-failures=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portfolio-browser-evidence-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
